info:
  namespace: glozz
items:
  cocina_sarten_comida:
    template: true
    display_name: '&f'
    resource:
      material: NETHER_BRICK
      generate: false
      model_path: cocina/recetas_sarten/cocina_sarten_comida
    behaviours:
      furniture:
        entity: item_frame
        solid: true
        cancel_drop: true
        fixed_rotation: true
        hitbox:
          length: 1
          width: 1
          height: 1
    events:
      placed_furniture:
        break:
          drop_item:
            item: glozz:cocina
          drop_item_2:
            item: glozz:sarten_sucio
          play_sound:
            name: minecraft:item.wolf_armor.break
            volume: 0.7
            pitch: 1
          execute_commands:
            cmd1:
              command: minecraft:tellraw {player} ["§c¡Has tirado la comida que había en la sartén!"]
              as_console: true
